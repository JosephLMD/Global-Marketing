const AC_MAP = {};

function _rl(h){                                     // luminancia relativa
  h=String(h).replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var v=[0,2,4].map(function(i){
    var c=parseInt(h.substr(i,2),16)/255;
    return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
  });
  return .2126*v[0]+.7152*v[1]+.0722*v[2];
}
function _contra(h){ return (1.05)/(_rl(h)+.05); }   // contra blanco
function _oscurece(h){                               // baja hasta 4,5:1
  h=String(h).replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  for(var i=0;i<40;i++){
    var hex='#'+[r,g,b].map(function(x){return ('0'+Math.round(x).toString(16)).slice(-2);}).join('');
    if(_contra(hex)>=4.5) return hex;
    r*=.92; g*=.92; b*=.92;
  }
  return '#333333';
}
function ACC(c){                                      // acento seguro
  if(!c || !PROJ) return c;
  var k=String(c).toLowerCase();
  return AC_MAP[k] || _oscurece(k);
}
function aplicaPaleta(){
  var p = PROJ ? PAL_P : PAL_N;

  BL = p.BL;
  AM = p.AM;
  RD = p.RD;
  BG = p.BG;
  BG2 = p.BG2;
  BG3 = p.BG3;
  W = p.W;
  G = p.G;
  BDR = p.BDR;
}
function toggleProyector(){

}

const QuizSlide = ({data,onFinish}) => {
  const [current,setCurrent]=useState(0);
  const [answers,setAnswers]=useState({});
  const [done,setDone]=useState(false);

  const answer=(idx)=>{
    if(answers[current]!==undefined) return;
    setAnswers(p=>({...p,[current]:idx}));
  };
  const next=()=>{
    if(current<data.questions.length-1) setCurrent(c=>c+1);
    else setDone(true);
  };

  if(done){
    const score=Object.keys(answers).filter(k=>answers[k]===data.questions[k].correct).length;
    const pct=Math.round((score/data.questions.length)*100);
    const rating=pct>=90?{l:'Global Marketing Expert 🏆',c:T}:pct>=70?{l:'Solid understanding — keep going ✅',c:BL}:pct>=50?{l:'Getting there — review the slides ⚠️',c:AM}:{l:'Needs reinforcement — review Chapter 1 🔴',c:RD};
    return(
      <div style={SR({display:'flex',height:'100%',alignItems:'center',justifyContent:'center',flexDirection:'column',padding:V(0,'48px 24px'),zIndex:2})}>
        <P style={{textAlign:'center'}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:PXV(96,64),color:rating.c,marginBottom:8}}>{score}/{data.questions.length}</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:PXV(32,22),color:rating.c,marginBottom:14}}>{rating.l}</div>
          <div style={{fontSize:PX(18),color:G,marginBottom:36}}>{pct}% correct answers</div>
          <div style={{display:'flex',gap:V(10,8),justifyContent:'center',flexWrap:'wrap',maxWidth:700,marginBottom:36}}>
            {data.questions.map((q,i)=>(
              <div key={i} style={{width:V(44,36),height:V(44,36),borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:answers[i]===q.correct?`${T}25`:`${RD}20`,border:`2px solid ${answers[i]===q.correct?T:RD}`,fontSize:PXV(16,14),color:answers[i]===q.correct?T:RD,fontWeight:FW(700)}}>
                {answers[i]===q.correct?'✓':'✗'}
              </div>
            ))}
          </div>
          <button onClick={onFinish} style={{background:T,color:INK(),border:'none',padding:'14px 40px',fontSize:PX(16),fontWeight:FW(700),borderRadius:100,cursor:'pointer',fontFamily:'inherit'}}>
            Continue →
          </button>
        </P>
      </div>
    );
  }

  const q=data.questions[current];
  const answered=answers[current]!==undefined;
  return(
    <div style={SR({padding:V('0 100px','32px 20px'),height:'100%',display:'flex',flexDirection:'column',justifyContent:'center',zIndex:2})}>
      <P>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:20,alignItems:'center',gap:14}}>
          <div style={{fontSize:PX(12),color:G,fontWeight:FW(700),letterSpacing:2}}>QUESTION {current+1} / {data.questions.length}</div>
          <div style={{width:V(220,100),height:5,background:BG2,borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',background:`linear-gradient(90deg,${T},${T2})`,width:`${((current+1)/data.questions.length)*100}%`,transition:'width .3s'}}/>
          </div>
        </div>
        <h3 style={{fontFamily:"'Fraunces',serif",fontSize:PXV(34,21),marginBottom:V(28,18),color:W,lineHeight:1.35}}>{q.q}</h3>
        <div style={{display:'flex',flexDirection:'column',gap:11,marginBottom:24}}>
          {q.opts.map((opt,i)=>{
            let bg=BG2,border=`1px solid ${BDR}`,color=W;
            if(answered){
              if(i===q.correct){bg=`${T}15`;border=`2px solid ${T}`;color=T;}
              else if(i===answers[current]){bg=`${RD}10`;border=`2px solid ${RD}`;color=RD;}
            }
            return(
              <div key={i} onClick={()=>answer(i)} style={{padding:V('15px 20px','13px 14px'),borderRadius:10,border,background:bg,fontSize:PXV(18,15),color,cursor:answered?'default':'pointer',transition:'all .2s'}}>
                {opt}
              </div>
            );
          })}
        </div>
        {answered&&(
          <button onClick={next} style={{background:T,color:INK(),border:'none',padding:'13px 34px',fontSize:PX(16),fontWeight:FW(700),borderRadius:100,cursor:'pointer',fontFamily:'inherit'}}>
            {current<data.questions.length-1?'Next Question →':'See Results →'}
          </button>
        )}
      </P>
    </div>
  );
};

// ── APP ────────────────────────────────────────────────────────────────────
function App(){
  const [cur,setCur]=useState(0);
  const [quizDone,setQuizDone]=useState(false);
  const [vw,setVw]=useState(window.innerWidth);
  const total=SLIDES.length;
  MOB = vw<=820; // refresh responsive flag before children render

  const next=useCallback(()=>setCur(c=>Math.min(c+1,total-1)),[total]);
  const prev=useCallback(()=>setCur(c=>Math.max(c-1,0)),[]);

  useEffect(()=>{
    const r=()=>setVw(window.innerWidth);
    window.addEventListener('resize',r);
    window.addEventListener('orientationchange',r);
    return()=>{window.removeEventListener('resize',r);window.removeEventListener('orientationchange',r);};
  },[]);

  useEffect(()=>{
    const h=e=>{
      if(e.key==='ArrowRight'||e.key===' ') next();
      if(e.key==='ArrowLeft') prev();
      if(e.key==='f'||e.key==='F'){
        if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
      }
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[next,prev]);

  const s=SLIDES[cur];

  // Touch swipe navigation (disabled on the quiz slide so a stray swipe can't lose quiz progress)
  useEffect(()=>{
    if(s.type==='quiz') return;
    let sx=0,sy=0;
    const ts=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;};
    const te=e=>{
      const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0) next(); else prev(); }
    };
    window.addEventListener('touchstart',ts,{passive:true});
    window.addEventListener('touchend',te,{passive:true});
    return()=>{window.removeEventListener('touchstart',ts);window.removeEventListener('touchend',te);};
  },[next,prev,s.type]);

  const renderSlide=()=>{
    TIPO = s.type;
    try{ var d=document.documentElement; d.dataset.tipo = s.type; d.dataset.compuesta = (COMPUESTAS.indexOf(s.type)>-1 ? '1' : '0');}catch(e){}
    switch(s.type){
      case 'title':            return <TitleSlide data={s}/>;
      case 'impact':           return <ImpactSlide data={s}/>;
      case 'agenda':           return <AgendaSlide data={s}/>;
      case 'module_title':     return <ModuleTitleSlide data={s}/>;
      case 'concept':          return <ConceptSlide data={s}/>;
      case 'case':             return <CaseSlide data={s}/>;
      case 'comparison':       return <ComparisonSlide data={s}/>;
      case 'porter_diamond':   return <PorterDiamondSlide/>;
      case 'five_forces':      return <FiveForcesSlide/>;
      case 'competitive_triangle': return <CompetitiveTriangleSlide/>;
      case 'competence_roots': return <CompetenceRootsSlide/>;
      case 'four_actions':     return <FourActionsSlide/>;
      case 'takeaways':        return <TakeawaysSlide data={s}/>;
      case 'discussion':       return <DiscussionSlide data={s}/>;
      case 'exercise':         return <ExerciseSlide key={cur} data={s}/>;
      case 'quiz_intro':       return <QuizIntroSlide data={s} onStart={next}/>;
      case 'quiz':             return <QuizSlide key={cur} data={s} onFinish={()=>{setQuizDone(true);next();}}/>;
      case 'closing':          return <ClosingSlide data={s}/>;
      default:                 return <TitleSlide data={s}/>;
    }
  };

  // Module color based on current slide
  const moduleColors = [T,T,T,BL,BL,BL,BL,BL,AM,AM,AM,AM,AM,AM,T,T,T,T,T,T,BL,BL,BL,BL,BL,AM,AM,AM,AM,AM,AM,T,T,T,T,T,T];
  const accentColor = moduleColors[cur]||T;

  return(
    <div className="app-root" style={{width:'100vw',display:'flex',flexDirection:'column',position:'relative',background:BG}}>
      <div className="bg-grid"/>
      <div className="bg-glow"/>
      <div className="bg-glow-left"/>
      <div key={cur} className={`slide-enter${(MOB||PROJ)?' slide-scroll':''}`} style={{flex:1,position:'relative',overflow:(MOB||PROJ)?'auto':'hidden'}}>
        {renderSlide()}
      </div>
      {/* FOOTER NAV */}
      <div style={{height:V(72,60),borderTop:`1px solid ${BDR}`,display:'flex',alignItems:'center',justifyContent:'space-between',padding:V('0 40px','0 14px'),gap:V(0,10),zIndex:10,background:BG2,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          {!MOB&&<div style={{display:'flex',flexDirection:'column',gap:2}}>
            <div style={{fontSize:PX(12),color:T,fontWeight:FW(700),letterSpacing:3,textTransform:'uppercase'}}>Universidad del Rosario</div>
            <div style={{fontSize:PX(11),color:`${G}70`,letterSpacing:1}}>Global Marketing · Chapter 4</div>
          </div>}
          {!MOB&&<button onClick={()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}} title="Fullscreen (F)" style={{background:'transparent',border:`1px solid ${BDR}`,color:G,width:32,height:32,borderRadius:8,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',marginLeft:8}}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" width="14" height="14"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>}
          {MOB&&<div style={{fontSize:PX(10),color:T,fontWeight:FW(700),letterSpacing:1,textTransform:'uppercase',whiteSpace:'nowrap'}}>Global Mkt · Ch.4</div>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:V(20,10),flex:V('none',1),justifyContent:'center'}}>
          <button onClick={prev} disabled={cur===0} style={{background:'transparent',border:`1px solid ${BDR}`,color:W,width:42,height:42,borderRadius:'50%',cursor:cur===0?'default':'pointer',opacity:cur===0?.25:1,fontSize:PX(18),fontFamily:'inherit',flexShrink:0}}>←</button>
          <div style={{width:V(300,'100%'),maxWidth:300,height:4,background:BG3,borderRadius:3,overflow:'hidden',flex:V('none',1)}}>
            <div style={{height:'100%',background:`linear-gradient(90deg,${T},${T2})`,width:`${((cur+1)/total)*100}%`,transition:'width .4s cubic-bezier(.4,0,.2,1)',borderRadius:3}}/>
          </div>
          <button onClick={next} disabled={cur===total-1} style={{background:'transparent',border:`1px solid ${BDR}`,color:W,width:42,height:42,borderRadius:'50%',cursor:cur===total-1?'default':'pointer',opacity:cur===total-1?.25:1,fontSize:PX(18),fontFamily:'inherit',flexShrink:0}}>→</button>
        </div>
        <div style={{fontSize:PXV(14,12),color:G,fontWeight:FW(600),fontFamily:"'Fraunces',serif",whiteSpace:'nowrap'}}>{cur+1} / {total}</div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
window.__rerender = () => root.render(<App/>);
</script>

<button id="pmode" onclick="toggleProyector()" title="Modo proyector / aula iluminada (light mode)">☀ Proyector</button>
<script>
/* ── arreglos proyector ── */
// React monta un nodo nuevo con className "slide-enter" cada vez que cambia la
// diapositiva (lleva key={cur}); los re-render dentro de la misma diapositiva
// reutilizan el nodo, así que esto NO se dispara al pulsar "Reveal answer".
(function(){
  var raiz = document.getElementById('root');
  if (!raiz || !window.MutationObserver) return;
  function arriba(){
    window.scrollTo(0, 0);
    if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
    var s = raiz.querySelector('.slide-enter');
    if (s) s.scrollTop = 0;
  }
  new MutationObserver(function(muts){
    for (var i = 0; i < muts.length; i++) {
      var add = muts[i].addedNodes;
      for (var j = 0; j < add.length; j++) {
        var n = add[j];
        if (n.nodeType === 1 && String(n.className || '').indexOf('slide-enter') > -1) {
          arriba();
          requestAnimationFrame(arriba);   // por si la animación de entrada mueve algo
          return;
        }
      }
    }
  }).observe(raiz, {childList: true, subtree: true});
})();
</script>

<div id="vz"><div class="lienzo"></div>
  <button class="cerrar" onclick="window.__vzCerrar()">Cerrar ✕</button>
  <div class="pista">Pellizca para acercar · aleja del todo para volver al encuadre</div>
</div>
<script>
/* ── visor y memoria de modo ── */
(function(){
  var CLAVE = 'curso-modo';

  /* ── 1 · recordar el modo entre capítulos ─────────────────────────── */
  function aplicaGuardado(){
    var q = null;
    try { q = localStorage.getItem(CLAVE); } catch(e){}
    if (q !== 'claro') return;
    var t = setInterval(function(){
      if (!window.toggleProyector) return;
      clearInterval(t);
      if (!document.documentElement.classList.contains('proyector')) window.toggleProyector();
    }, 60);
    setTimeout(function(){ clearInterval(t); }, 6000);
  }
  aplicaGuardado();

  var btn = document.getElementById('pmode');
  if (btn) btn.addEventListener('click', function(){
    setTimeout(function(){
      try {
        localStorage.setItem(CLAVE,
          document.documentElement.classList.contains('proyector') ? 'claro' : 'oscuro');
      } catch(e){}
      var h = document.getElementById('hintmodo');
      if (h) h.style.display = 'none';
    }, 30);
  });

  /* aviso la primera vez, sólo en pantalla pequeña */
  function pista(){
    if (window.innerWidth > 820) return;
    var visto = null;
    try { visto = localStorage.getItem(CLAVE); } catch(e){}
    if (visto) return;
    var d = document.createElement('div');
    d.id = 'hintmodo';
    d.innerHTML = '<span class="x">&times;</span>' +
      '<b>¿Tu profe proyecta en fondo claro?</b>' +
      'Toca el botón <b style="display:inline">☀ Proyector</b> arriba a la derecha ' +
      'y verás exactamente lo mismo que está en la pantalla del salón.';
    document.body.appendChild(d);
    d.style.display = 'block';
    d.querySelector('.x').onclick = function(){
      d.style.display = 'none';
      try { localStorage.setItem(CLAVE, 'oscuro'); } catch(e){}
    };
    setTimeout(function(){ if (d) d.style.display = 'none'; }, 14000);
  }
  window.addEventListener('load', function(){ setTimeout(pista, 1200); });

  /* ── 2 · visor de diagramas a pantalla completa ───────────────────── */
  var vz = document.getElementById('vz'), lienzo = vz.querySelector('.lienzo');
  var esc = 1, x = 0, y = 0, d0 = 0, esc0 = 1, px = 0, py = 0, arrastrando = false;

  function pinta(){ lienzo.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + esc + ')'; }
  function encuadre(){ esc = 1; x = 0; y = 0; pinta(); }

  function decorativo(el){
    /* el arte de fondo va casi transparente y sin recibir clics */
    for (var i = 0, n = el; i < 4 && n && n !== document.body; i++, n = n.parentElement){
      var cs = getComputedStyle(n);
      if (parseFloat(cs.opacity) < 0.3) return true;
      if (cs.pointerEvents === 'none') return true;
      var cl = String(n.className && n.className.baseVal !== undefined
                      ? n.className.baseVal : (n.className || ''));
      if (/bg-(art|grid|glow)/.test(cl)) return true;
    }
    return false;
  }
  function grande(svg){
    var vb = (svg.getAttribute('viewBox') || '').split(/[ ,]+/);
    if (vb.length < 4) return false;
    if (!(+vb[2] >= 200 && +vb[3] >= 120)) return false;   // fuera los iconos de 24×24
    return !decorativo(svg);                                // fuera el arte de fondo
  }

  window.__vzAbrir = function(svg){
    lienzo.innerHTML = '';
    var c = svg.cloneNode(true);
    c.removeAttribute('style');
    c.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    lienzo.appendChild(c);
    encuadre();
    vz.classList.add('on');
    document.body.style.overflow = 'hidden';
  };
  window.__vzCerrar = function(){
    vz.classList.remove('on');
    lienzo.innerHTML = '';
    document.body.style.overflow = '';
  };

  /* abrir por delegación: sobrevive a cada re-render de React */
  function pantallaChica(){
    return window.innerWidth <= 820 ||
           (window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  }
  document.addEventListener('click', function(e){
    if (vz.classList.contains('on')) return;
    if (!pantallaChica()) return;      /* en proyector el esquema ya se ve grande:
                                          abrirlo taparía la proyección entera */
    var svg = e.target.closest ? e.target.closest('svg') : null;
    if (!svg || !grande(svg)) return;
    if (svg.closest('#vz')) return;
    e.preventDefault();
    window.__vzAbrir(svg);
  }, true);

  /* marcar los diagramas como ampliables */
  function marcar(){
    document.querySelectorAll('#root svg').forEach(function(s){
      if (!grande(s) || s.classList.contains('zoomable')) return;
      s.classList.add('zoomable');
      var p = s.parentNode;
      if (p && pantallaChica() && !p.querySelector('.tocar')) {
        var cs = getComputedStyle(p);
        if (cs.position === 'static') p.style.position = 'relative';
        var b = document.createElement('span');
        b.className = 'tocar'; b.textContent = 'Toca para ampliar';
        p.appendChild(b);
      }
    });
  }
  var raiz = document.getElementById('root');
  if (raiz && window.MutationObserver) {
    new MutationObserver(function(){ marcar(); }).observe(raiz, {childList:true, subtree:true});
  }
  window.addEventListener('load', function(){ setTimeout(marcar, 500); });

  /* ── gestos ────────────────────────────────────────────────────────── */
  function dist(t){
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  vz.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){ d0 = dist(e.touches); esc0 = esc; }
    else if (e.touches.length === 1 && esc > 1){
      arrastrando = true; px = e.touches[0].clientX - x; py = e.touches[0].clientY - y;
    }
  }, {passive:true});
  vz.addEventListener('touchmove', function(e){
    if (e.touches.length === 2 && d0){
      e.preventDefault();
      esc = Math.min(6, Math.max(0.6, esc0 * (dist(e.touches) / d0)));
      if (esc <= 1.02) { encuadre(); } else { pinta(); }
    } else if (arrastrando && e.touches.length === 1){
      e.preventDefault();
      x = e.touches[0].clientX - px; y = e.touches[0].clientY - py; pinta();
    }
  }, {passive:false});
  vz.addEventListener('touchend', function(e){
    if (e.touches.length === 0){
      arrastrando = false; d0 = 0;
      /* alejar del todo = volver al encuadre original */
      if (esc <= 1.02) encuadre();
    }
  }, {passive:true});

  /* rueda del ratón, para el portátil */
  vz.addEventListener('wheel', function(e){
    if (!vz.classList.contains('on')) return;
    e.preventDefault();
    esc = Math.min(6, Math.max(0.6, esc * (e.deltaY < 0 ? 1.12 : 0.89)));
    if (esc <= 1.02) encuadre(); else pinta();
  }, {passive:false});

  vz.addEventListener('dblclick', function(){ esc > 1.02 ? encuadre() : (esc = 2, pinta()); });

  /* .lienzo cubre toda la pantalla, así que comparar con e.target===vz nunca
     funcionaba. Cierra cualquier toque que NO caiga sobre el dibujo. */
  vz.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('svg')) return;
    if (e.target.closest && e.target.closest('.cerrar')) return;
    window.__vzCerrar();
  });

  /* las flechas y Escape cierran, en vez de quedar atrapadas detrás del visor */
  document.addEventListener('keydown', function(e){
    if (!vz.classList.contains('on')) return;
    if (e.key === 'Escape' || e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
        e.key === ' ' || e.key === 'PageUp' || e.key === 'PageDown') {
      window.__vzCerrar();
    }
  }, true);

  /* si por lo que sea cambia la diapositiva, el visor no se queda encima */
  if (raiz && window.MutationObserver) {
    new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++) {
        var add = muts[i].addedNodes;
        for (var j = 0; j < add.length; j++) {
          var n = add[j];
          if (n.nodeType === 1 && String(n.className || '').indexOf('slide-enter') > -1) {
            if (vz.classList.contains('on')) window.__vzCerrar();
            return;
          }
        }
      }
    }).observe(raiz, {childList: true, subtree: true});
  }
})();
</script>
