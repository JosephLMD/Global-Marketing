const CompetenceRootsSlide = () => {
  const layers=[
    {t:'PERFORMANCE',          d:'Market share, profit, growth — the visible result',                 c:T2, w:'52%'},
    {t:'COMPETITIVE ADVANTAGE',d:'Higher perceived value or lower relative cost than rivals',        c:T,  w:'68%'},

    {t:'RESOURCES',            d:'Tangible assets (flexible, short term) + tacit knowledge (intangible, long term)', c:AM, w:'100%'},

  return (
    <div style={SR({padding:V('0 80px','32px 20px'),height:'100%',display:'flex',flexDirection:'column',justifyContent:'center',zIndex:2})}>

        <ModuleTag module="Module 4"/>

        <div style={{display:'flex',flexDirection:'column',gap:V(10,8),alignItems:'center'}}>
          {layers.map((l,i)=>(
            <div key={i} style={{width:V(l.w,'100%'),background:BG2,border:`1px solid ${l.c}40`,borderRadius:12,padding:V('13px 20px','11px 14px'),textAlign:'center'}}>

        </div>
      </P>
    </div>
  );
};

        <div style={{fontSize:V(22,16),lineHeight:1.55,textAlign:'center',marginBottom:V(32,20),color:W}}>{data.question}</div>
        <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:V(28,20)}}>
          {data.options.map((opt,i)=>(
            <div key={i} style={{padding:V('18px 22px','14px 16px'),borderRadius:12,border:revealed?(i===data.correct?`2px solid ${T}`:`1px solid ${RD}30`):`1px solid ${BDR}`,background:revealed?(i===data.correct?`${T}12`:`${RD}08`):BG2,fontSize:V(18,15),transition:'all .25s',color:revealed?(i===data.correct?T:G):W}}>
              {opt}
            </div>
          ))}
        </div>
        <div style={{textAlign:'center'}}>
          {!revealed?(
            <button onClick={()=>setRevealed(true)} style={{background:T,color:'#000',border:'none',padding:'15px 42px',fontSize:16,fontWeight:700,borderRadius:100,cursor:'pointer',fontFamily:'inherit'}}>
              Reveal Answer
            </button>
          ):(
            <div style={{background:`${T}12`,border:`1px solid ${T}35`,padding:V('18px 24px','14px 16px'),borderRadius:12,color:T,fontSize:V(17,14),lineHeight:1.6,textAlign:'left'}}>
              <strong>Explanation:</strong> {data.explanation}
            </div>
          )}
        </div>
      </P>
    </div>
  );
};

const QuizIntroSlide = ({data,onStart}) => (
  <div style={SR({display:'flex',height:'100%',alignItems:'center',justifyContent:'center',flexDirection:'column',padding:V(0,'48px 24px'),zIndex:2})}>
    <div className="bg-art"><BgGlobe opacity={.05}/></div>
    <P style={{textAlign:'center'}}>
      <div style={{width:V(80,60),height:V(80,60),margin:'0 auto 28px',opacity:.8}}>{Ico.target(T)}</div>
      <h1 style={{fontFamily:"'Fraunces',serif",fontSize:V(68,38),marginBottom:14}}>{data.title}</h1>
      <p style={{fontSize:V(22,16),color:G,marginBottom:V(48,32)}}>{data.subtitle}</p>
      <button onClick={onStart} style={{background:T,color:'#000',border:'none',padding:'18px 56px',fontSize:20,fontWeight:700,borderRadius:100,cursor:'pointer',fontFamily:'inherit'}}>
        Start Assessment →
      </button>
    </P>
  </div>
);

const QuizSlide = ({data,onFinish}) => {
  const [current,setCurrent]=useState(0);
  const [answers,setAnswers]=useState({});
  const [done,setDone]=useState(false);

  const answer=(idx)=>{
    if(answers[current]!==undefined) return;
    setAnswers(p=>({...p,[current]:idx}));
  };
  const next=()=>{
    if(current<data.questions.length-1) setCurrent(c=>c+1);
    else setDone(true);
  };

  if(done){
    const score=Object.keys(answers).filter(k=>answers[k]===data.questions[k].correct).length;
    const pct=Math.round((score/data.questions.length)*100);
    const rating=pct>=90?{l:'Global Marketing Expert 🏆',c:T}:pct>=70?{l:'Solid understanding — keep going ✅',c:BL}:pct>=50?{l:'Getting there — review the slides ⚠️',c:AM}:{l:'Needs reinforcement — review Chapter 1 🔴',c:RD};
    return(
      <div style={SR({display:'flex',height:'100%',alignItems:'center',justifyContent:'center',flexDirection:'column',padding:V(0,'48px 24px'),zIndex:2})}>
        <P style={{textAlign:'center'}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:V(96,64),color:rating.c,marginBottom:8}}>{score}/{data.questions.length}</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:V(32,22),color:rating.c,marginBottom:14}}>{rating.l}</div>
          <div style={{fontSize:18,color:G,marginBottom:36}}>{pct}% correct answers</div>
          <div style={{display:'flex',gap:V(10,8),justifyContent:'center',flexWrap:'wrap',maxWidth:700,marginBottom:36}}>
            {data.questions.map((q,i)=>(
              <div key={i} style={{width:V(44,36),height:V(44,36),borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:answers[i]===q.correct?`${T}25`:`${RD}20`,border:`2px solid ${answers[i]===q.correct?T:RD}`,fontSize:V(16,14),color:answers[i]===q.correct?T:RD,fontWeight:700}}>
                {answers[i]===q.correct?'✓':'✗'}
              </div>
            ))}
          </div>
          <button onClick={onFinish} style={{background:T,color:'#000',border:'none',padding:'14px 40px',fontSize:16,fontWeight:700,borderRadius:100,cursor:'pointer',fontFamily:'inherit'}}>
            Continue →
          </button>
        </P>
      </div>
    );
  }

  const q=data.questions[current];
  const answered=answers[current]!==undefined;
  return(
    <div style={SR({padding:V('0 100px','32px 20px'),height:'100%',display:'flex',flexDirection:'column',justifyContent:'center',zIndex:2})}>
      <P>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:20,alignItems:'center',gap:14}}>
          <div style={{fontSize:12,color:G,fontWeight:700,letterSpacing:2}}>QUESTION {current+1} / {data.questions.length}</div>
          <div style={{width:V(220,100),height:5,background:BG2,borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',background:`linear-gradient(90deg,${T},${T2})`,width:`${((current+1)/data.questions.length)*100}%`,transition:'width .3s'}}/>
          </div>
        </div>
        <h3 style={{fontFamily:"'Fraunces',serif",fontSize:V(34,21),marginBottom:V(28,18),color:W,lineHeight:1.35}}>{q.q}</h3>
        <div style={{display:'flex',flexDirection:'column',gap:11,marginBottom:24}}>
          {q.opts.map((opt,i)=>{
            let bg=BG2,border=`1px solid ${BDR}`,color=W;
            if(answered){
              if(i===q.correct){bg=`${T}15`;border=`2px solid ${T}`;color=T;}
              else if(i===answers[current]){bg=`${RD}10`;border=`2px solid ${RD}`;color=RD;}
            }
            return(
              <div key={i} onClick={()=>answer(i)} style={{padding:V('15px 20px','13px 14px'),borderRadius:10,border,background:bg,fontSize:V(18,15),color,cursor:answered?'default':'pointer',transition:'all .2s'}}>
                {opt}
              </div>
            );
          })}
        </div>
        {answered&&(
          <button onClick={next} style={{background:T,color:'#000',border:'none',padding:'13px 34px',fontSize:16,fontWeight:700,borderRadius:100,cursor:'pointer',fontFamily:'inherit'}}>
            {current<data.questions.length-1?'Next Question →':'See Results →'}
          </button>
        )}
      </P>
    </div>
  );
};

const PromptSlide = ({data}) => {
  const c = data.color || T;
  const [copied,setCopied] = useState(false);
  const copy = () => {
    try { navigator.clipboard.writeText(data.prompt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1600);}); }
    catch(e){ setCopied(true); setTimeout(()=>setCopied(false),1600); }
  };
  return (
  <div style={SR({padding:V('0 80px','28px 18px'),height:'100%',display:'flex',flexDirection:'column',justifyContent:'center',zIndex:2})}>
    <div className="bg-art"><BgGlobe opacity={.035}/></div>
    <P>
      <ModuleTag module={data.tool} color={c}/>
      <h2 style={{fontFamily:"'Fraunces',serif",fontSize:V(38,25),color:W,margin:'0 0 10px',lineHeight:1.1}}>{data.title}</h2>
      <p style={{fontSize:V(17,13.5),lineHeight:1.6,color:G,margin:'0 0 18px',maxWidth:900}}>{data.intro}</p>
      <div style={{position:'relative',background:'#0a0d12',border:`1px solid ${c}45`,borderLeft:`4px solid ${c}`,borderRadius:10,padding:V('22px 24px','16px 14px'),maxHeight:V('44vh','46vh'),overflowY:'auto'}}>
        <button onClick={copy} style={{position:'absolute',top:12,right:12,background:c,color:'#08120c',border:'none',borderRadius:7,padding:'7px 15px',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",zIndex:3}}>{copied?'Copied ✓':'Copy'}</button>
        <pre style={{margin:0,whiteSpace:'pre-wrap',wordBreak:'break-word',fontFamily:"'Courier New',ui-monospace,monospace",fontSize:V(14.5,11.5),lineHeight:1.62,color:'#d8e4d2',paddingRight:V(64,52)}}>{data.prompt}</pre>
      </div>
      {data.output&&<div style={{marginTop:14,fontSize:V(15,12.5),color:c,display:'flex',gap:10,alignItems:'flex-start'}}><div style={{width:16,height:16,flexShrink:0,marginTop:2}}>{Ico.zap(c)}</div>{data.output}</div>}
    </P>
  </div>
  );
};

const ClosingSlide = ({data}) => (
  <div style={SR({display:'flex',height:'100%',alignItems:'center',justifyContent:'center',flexDirection:'column',padding:V('0 120px','48px 24px'),textAlign:'center',zIndex:2})}>
    <div className="bg-art"><BgGlobe opacity={.06}/></div>
    <P>
      <div style={{width:60,height:60,margin:'0 auto 28px',opacity:.7}}>{Ico.globe(T)}</div>
      <h1 style={{fontFamily:"'Fraunces',serif",fontSize:V(62,34),marginBottom:20,lineHeight:1.1}}>{data.title}</h1>
      <p style={{fontSize:V(20,16),color:G,marginBottom:V(40,28),whiteSpace:'pre-line',lineHeight:1.7}}>{data.subtitle}</p>
      <div style={{background:`${T}10`,border:`1px solid ${T}30`,borderRadius:14,padding:V('22px 36px','16px 18px'),maxWidth:800,margin:'0 auto'}}>
        <div style={{fontSize:V(18,15),color:W,fontStyle:'italic',lineHeight:1.7}}>{data.quote}</div>
      </div>
      <div style={{marginTop:V(40,28),fontSize:V(13,11),color:`${G}60`,letterSpacing:2,textTransform:'uppercase'}}>Universidad del Rosario · Global Marketing · Hollensen 5th Ed.</div>
    </P>
  </div>
);

// ── APP ────────────────────────────────────────────────────────────────────
function App(){
  const [cur,setCur]=useState(0);
  const [quizDone,setQuizDone]=useState(false);
  const [vw,setVw]=useState(window.innerWidth);
  const total=SLIDES.length;
  MOB = vw<=820; // refresh responsive flag before children render

  const next=useCallback(()=>setCur(c=>Math.min(c+1,total-1)),[total]);
  const prev=useCallback(()=>setCur(c=>Math.max(c-1,0)),[]);

  useEffect(()=>{
    const r=()=>setVw(window.innerWidth);
    window.addEventListener('resize',r);
    window.addEventListener('orientationchange',r);
    return()=>{window.removeEventListener('resize',r);window.removeEventListener('orientationchange',r);};
  },[]);

  useEffect(()=>{
    const h=e=>{
      if(e.key==='ArrowRight'||e.key===' ') next();
      if(e.key==='ArrowLeft') prev();
      if(e.key==='f'||e.key==='F'){
        if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
      }
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[next,prev]);

  const s=SLIDES[cur];

  // Touch swipe navigation (disabled on the quiz slide so a stray swipe can't lose quiz progress)
  useEffect(()=>{
    if(s.type==='quiz') return;
    let sx=0,sy=0;
    const ts=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;};
    const te=e=>{
      const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0) next(); else prev(); }
    };
    window.addEventListener('touchstart',ts,{passive:true});
    window.addEventListener('touchend',te,{passive:true});
    return()=>{window.removeEventListener('touchstart',ts);window.removeEventListener('touchend',te);};
  },[next,prev,s.type]);

  const renderSlide=()=>{
    switch(s.type){
      case 'title':            return <TitleSlide data={s}/>;
      case 'impact':           return <ImpactSlide data={s}/>;
      case 'agenda':           return <AgendaSlide data={s}/>;
      case 'module_title':     return <ModuleTitleSlide data={s}/>;
      case 'concept':          return <ConceptSlide data={s}/>;
      case 'case':             return <CaseSlide data={s}/>;
      case 'comparison':       return <ComparisonSlide data={s}/>;
      case 'porter_diamond':   return <PorterDiamondSlide/>;
      case 'five_forces':      return <FiveForcesSlide/>;
      case 'competitive_triangle': return <CompetitiveTriangleSlide/>;
      case 'competence_roots': return <CompetenceRootsSlide/>;
      case 'four_actions':     return <FourActionsSlide/>;
      case 'takeaways':        return <TakeawaysSlide data={s}/>;
      case 'discussion':       return <DiscussionSlide data={s}/>;
      case 'exercise':         return <ExerciseSlide key={cur} data={s}/>;
      case 'quiz_intro':       return <QuizIntroSlide data={s} onStart={next}/>;
      case 'quiz':             return <QuizSlide key={cur} data={s} onFinish={()=>{setQuizDone(true);next();}}/>;
      case 'closing':          return <ClosingSlide data={s}/>;
      case 'prompt':           return <PromptSlide data={s}/>;
      default:                 return <TitleSlide data={s}/>;
    }
  };

  // Module color based on current slide
  const moduleColors = [T,T,T,BL,BL,BL,BL,BL,AM,AM,AM,AM,AM,AM,T,T,T,T,T,T,BL,BL,BL,BL,BL,AM,AM,AM,AM,AM,AM,T,T,T,T,T,T];
  const accentColor = moduleColors[cur]||T;

  return(
    <div className="app-root" style={{width:'100vw',display:'flex',flexDirection:'column',position:'relative',background:BG}}>
      <div className="bg-grid"/>
      <div className="bg-glow"/>
      <div className="bg-glow-left"/>
      <div key={cur} className={`slide-enter${MOB?' slide-scroll':''}`} style={{flex:1,position:'relative',overflow:MOB?'auto':'hidden'}}>
        {renderSlide()}
      </div>
      {/* FOOTER NAV */}
      <div style={{height:V(72,60),borderTop:`1px solid ${BDR}`,display:'flex',alignItems:'center',justifyContent:'space-between',padding:V('0 40px','0 14px'),gap:V(0,10),zIndex:10,background:BG2,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          {!MOB&&<div style={{display:'flex',flexDirection:'column',gap:2}}>
            <div style={{fontSize:12,color:T,fontWeight:700,letterSpacing:3,textTransform:'uppercase'}}>Universidad del Rosario</div>
            <div style={{fontSize:11,color:`${G}70`,letterSpacing:1}}>Global Marketing · Toolkit</div>
          </div>}
          {!MOB&&<button onClick={()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}} title="Fullscreen (F)" style={{background:'transparent',border:`1px solid ${BDR}`,color:G,width:32,height:32,borderRadius:8,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',marginLeft:8}}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" width="14" height="14"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>}
          {MOB&&<div style={{fontSize:10,color:T,fontWeight:700,letterSpacing:1,textTransform:'uppercase',whiteSpace:'nowrap'}}>Global Mkt · Ch.4</div>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:V(20,10),flex:V('none',1),justifyContent:'center'}}>
          <button onClick={prev} disabled={cur===0} style={{background:'transparent',border:`1px solid ${BDR}`,color:W,width:42,height:42,borderRadius:'50%',cursor:cur===0?'default':'pointer',opacity:cur===0?.25:1,fontSize:18,fontFamily:'inherit',flexShrink:0}}>←</button>
          <div style={{width:V(300,'100%'),maxWidth:300,height:4,background:BG3,borderRadius:3,overflow:'hidden',flex:V('none',1)}}>
            <div style={{height:'100%',background:`linear-gradient(90deg,${T},${T2})`,width:`${((cur+1)/total)*100}%`,transition:'width .4s cubic-bezier(.4,0,.2,1)',borderRadius:3}}/>
          </div>
          <button onClick={next} disabled={cur===total-1} style={{background:'transparent',border:`1px solid ${BDR}`,color:W,width:42,height:42,borderRadius:'50%',cursor:cur===total-1?'default':'pointer',opacity:cur===total-1?.25:1,fontSize:18,fontFamily:'inherit',flexShrink:0}}>→</button>
        </div>
        <div style={{fontSize:V(14,12),color:G,fontWeight:600,fontFamily:"'Fraunces',serif",whiteSpace:'nowrap'}}>{cur+1} / {total}</div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
